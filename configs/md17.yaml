name: md17
batch_size: 128
batch_on: molecules
in_channels: 3
out_channels: 3
loss: l1_loss
learning_rate: 0.001
node_level: true
resolution: atom
benchmark: B_RMDASP
transforms:
  - TokenizeAtoms:
      alphabet: HCO
  - OneHotAtomFeatures:
      alphabet: HCO
  - KnnGraph:
      k: 8
      resolution: atom
  - LocalReferenceFrames:
      resolution: atom