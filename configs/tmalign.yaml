name: tmalign
batch_size: 32
batch_on: scenes
pairwise: true
in_channels: 21
out_channels: 1
loss: l1_loss
learning_rate: 0.001
node_level: false
resolution: residue
num_layers: 6
benchmark: B_PSTMAL
trainer:
  collater: PairwiseLongCollater
  clip_grad_norm: 1.0
  limit_train_batches: 800
  patience: 15
transforms:
  - ResiduePositions:
  - TokenizeResidues:
  - OneHotResidueFeatures:
  - StandardizePairwise:
      meta: lddt
  - KnnGraph:
      k: 16
      resolution: residue
  - LocalReferenceFrames:
      resolution: residue
