name: dock
batch_size: 32
batch_on: molecules
in_channels: 46
out_channels: 1
loss: l1_loss
learning_rate: 0.0003
node_level: false
resolution: residue
num_layers: 6
benchmark:
  name: B_BIOLIP
  dataset: D_BIOLIP
  sampler: MoleculeSampler
  task:
    PropertyPredictionTask:
      property: pkd
      resolution: residue
  metric:
    - MeanAbsoluteErrorMetric
    - SpearmansRhoMetric
trainer:
  clip_grad_norm: 1.0
  patience: 20
  epochs: 50
transforms:
  - ExplodeLigandAtoms:
  - ResiduePositions:
  - TokenizeByChainType:
  - Standardize:
      field: molecule_pkd
  - KnnGraph:
      k: 16
      resolution: residue
  - LocalReferenceFrames:
      resolution: residue
