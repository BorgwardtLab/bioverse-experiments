name: gym
batch_size: 128
batch_on: molecules
in_channels: 20
out_channels: 1
loss: mse_loss
learning_rate: 0.001
node_level: true
resolution: residue
benchmark: B_PROGYM
transforms:
  - ResiduePositions:
  - TokenizeResidues:
  - OneHotResidueFeatures:
  - ResidueBackboneAtoms:
  - KnnGraph:
      k: 8
      resolution: residue
  - LocalReferenceFrames:
      resolution: residue