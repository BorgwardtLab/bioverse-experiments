in_channels: [6, 32]
transforms:
  - ResiduePositions:
      mode: CA
  - TokenizeResidues:
  - ResidueBackboneAtoms:
live_transforms:
  - KnnGraph:
      k: 8 # 30 is the default
      resolution: residue
  - Dihedrals:
  - Orientations:
  - Sidechains:
  - EdgeVectors:
  - Rbf:
  - EdgePosEmb:
  - CreateFeatureFromOthers:
      feature_level: vertex
      source_attrs:
        - residue_dihedrals
      target_attr: residue_features
  - CreateFeatureFromOthers:
      feature_level: edge
      source_attrs:
        - molecule_edge_rbf
        - molecule_edge_pos_emb
      target_attr: molecule_edge_features